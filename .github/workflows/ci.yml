name: MealMate CI

on:
  push:
    branches:
      - developer
      - feature

  pull_request:
    branches:
      - developer

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MealMate.slnx

      - name: Build solution
        run: dotnet build MealMate.slnx --no-restore

      - name: Run tests
        run: dotnet test MealMate.slnx --no-build
